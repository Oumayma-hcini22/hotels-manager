# ===== Serveur =====
# Render impose son port via la variable PORT ; en local : 8084
server.port=${PORT:8084}
# derriere Render / Cloudflare (https) : sinon erreurs 403 CORS sur les fichiers Angular
server.forward-headers-strategy=framework

# ===== Base de donnees =====
# local : MySQL de XAMPP / Render : PostgreSQL (variables d'environnement)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hsm_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MariaDBDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

